[package]
name = "webtrans-quion"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native WebTransport implementation built on top of QUIC using Quion."
repository = "https://github.com/foctal/webtrans"
readme = "../README.md"
keywords = ["network", "webtransport", "native"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[dependencies]
bytes = { workspace = true }
futures = "0.3"
http = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "sync", "time", "net"] }
quion = { version = "0.2.1", default-features = false, features = ["runtime-tokio", "datagram"] }
rustls = { version = "0.23.45", default-features = false, features = ["logging", "std"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
webtrans-proto = { workspace = true }
webtrans-trait = { workspace = true }

[features]
default = ["ring"]
ring = ["quion/rustls-ring", "rustls/ring"]
aws-lc-rs = ["quion/rustls-aws-lc-rs", "rustls/aws-lc-rs"]

[dev-dependencies]
webtrans-quinn = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

tempfile = "3"
