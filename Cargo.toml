[workspace]
resolver = "2"
members = [
    "webtrans",
    "webtrans-proto", 
    "webtrans-quinn", 
    "webtrans-trait", 
    "webtrans-wasm", 
    "webtrans-wasm-demo"
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["shellrow <shellrow@foctal.com>"]

[workspace.dependencies]
webtrans-proto = { path = "webtrans-proto" }
webtrans-trait = { path = "webtrans-trait" }
webtrans-quinn = { path = "webtrans-quinn" }
webtrans-wasm = { path = "webtrans-wasm" }
bytes = "1"
thiserror = "2"
http = "1"
url = "2"
tracing = "0.1"
