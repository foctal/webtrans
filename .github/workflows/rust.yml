name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  quion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check Quion facade and examples
        run: cargo check -p webtrans --no-default-features --features quion --all-targets --locked
      - name: Check both native backends
        run: cargo check -p webtrans --all-features --all-targets --locked
      - name: Check manual crypto configuration
        run: cargo check -p webtrans-quion --no-default-features --locked
      - name: Test AWS-LC crypto
        run: cargo test -p webtrans-quion --no-default-features --features aws-lc-rs --locked
      - name: Check browser facade with Quion selected
        run: cargo check -p webtrans --no-default-features --features quion --target wasm32-unknown-unknown --locked
